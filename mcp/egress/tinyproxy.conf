Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Notice
MaxClients 50
# Only private (Docker) addresses may use the proxy.
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16
# HTTPS only (CONNECT to port 443), and only to the hosts listed in `allowed`.
ConnectPort 443
Filter "/etc/tinyproxy/allowed"
FilterType ere
FilterDefaultDeny Yes
FilterURLs Off
FilterCaseSensitive Off
DisableViaHeader Yes
