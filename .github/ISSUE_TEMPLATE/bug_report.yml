name: Bug report
description: Report a problem with Trelune
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Please do not include credentials, tokens, or other sensitive information. For security vulnerabilities, use the private reporting instructions in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Select...\n3. Observe..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Trelune version
      placeholder: e.g. 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. macOS 14.7
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots or relevant logs with private information removed.
